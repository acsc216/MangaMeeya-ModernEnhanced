; 7z.spi 配置文件 / configuration for the 7-Zip Susie archive plug-in
;
; 放在 7z.spi 同一目录（SusiePlugin\7z.ini）即可生效。
; 如果没有这个文件，插件会尝试读取 MangaMeeya.exe 旁边 MangaMeeya.ini 的 [7z] 段。
; 环境变量（MM7Z_*）会覆盖这里的设置。
;
; Place next to 7z.spi.  If absent, the [7z] section of MangaMeeya.ini in the
; application directory is used.  MM7Z_* environment variables override it.

[7z]

; 缓存总量上限，单位 MiB。0 = 不自动清理。
; 超过上限时按“最久未使用”删除旧缓存目录；当前打开档案的缓存不会被删。
; Total cache size limit in MiB. 0 disables automatic cleanup.  The least
; recently used cache directories are removed; the active archive is kept.
; Default: 5120 (5 GB)
CacheMaxMB=5120

; 单块固实包的预读窗口，单位 MiB。0 = 只解到当前页。
; Read-ahead window for single-block solid archives, MiB. 0 = current page only.
; Default: 64
PrefetchMB=64

; 多块固实包的并行解码进程数。0 = 自动（min(块数, CPU 数, 8)）。
; Parallel decoder processes for multi-block solid archives.
; 0 = auto: min(blocks, CPUs, 8); 1..16 = fixed.
; Default: 0
Threads=0

; 会话级内存缓存：1 = 启用，0 = 关闭。
; 数据由 Windows 缓存管理器放在内存中，进程退出即删除，不跨会话复用。
; Session-only memory cache: 1 = on, 0 = off.  Data lives in the Windows
; cache manager and is deleted when the process exits (no cross-session reuse).
; Default: 0
MemCache=0

; 诊断日志：1 = 写入 %TEMP%\7zspi.log。
; Diagnostics: 1 = append to %TEMP%\7zspi.log.
; Default: 0
Log=0

; 记住密码：密码框内复选框的默认状态（1 = 勾选，0 = 不勾选）。
; 用户在密码框里的勾选/取消会被记住（%APPDATA%\MangaMeeya_7z\remember），
; 并决定是否保存当前密码；取消勾选会删除该档案已保存的密码。
; 密码用 Windows DPAPI（当前用户）加密后保存在 %APPDATA%\MangaMeeya_7z\passwords；
; 删除该目录可清除已保存的密码。
; Remember password: initial state of the dialog checkbox (1 = checked).
; The user's choice is remembered per user (%APPDATA%\MangaMeeya_7z\remember)
; and decides whether the current password is saved; unchecking deletes any
; saved password for that archive.  Passwords are encrypted with Windows DPAPI
; under %APPDATA%\MangaMeeya_7z\passwords; delete that directory to forget them.
; Default: 1
RememberPassword=1
